<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuario</title>
</head>
<body>
<div th:object="${usuario}">

<p><strong>Nombre:</strong> <span th:text="*{nick}">Nombre por defecto</span></p>
<p><strong>Fecha de Registro:</strong> <span th:text="*{fechaRegistro}">2023-01-01</span></p>
<p><strong>País:</strong> <span th:text="*{pais}">País por defecto</span></p>

<!-- Accedemos directamente a la variable permanencia -->
<p><strong>Permanencia:</strong> <span th:text="${permanencia}">0</span> años</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Juego</title>
</head>
<body>
<div th:object="${juego}">
    <p> Titulo: <span th:text="*{titulo}"></span></p>
    <p> Género: <span th:text="*{genero}"></span></p>
    <p> Precio: <span th:text="*{precio}"></span></p>
    <p> Horas jugadas: <span th:text="*{horasJugadas}"></span></p>
    <p> Coste por horas <span th:text ="${costeHoras}"></span></p>
    <p> Tipo de jugador <span th:text="${tipoJugador}"></span></p>


</div>

</body>
</html>
